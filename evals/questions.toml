[[question]]
id = "q10"
split = "test"
text = "how many kv heads does hysparse2 use vs the original hysparse, and why'd they switch?"
answer = "Key points: (1) HySparse2 has 64 query heads and 1 KV head (MQA, head dim 256/256), vs 64/4 (GQA, 192/128) in HySparse; (2) reason: MQA gives a smaller KV cache and more efficient token-level sparse-attention kernels."

