[[question]]
id = "q02"
split = "dev"
text = "как ухудшится performance модели на инференсе, если ей выключить натренированный engram модуль, и как это соотносится с baseline моделью без engram?"
answer = "Key points: (1) with the module switched off, factual-knowledge tasks collapse to about 29-44% of the full Engram model's own score (TriviaQA 29%); (2) reading comprehension barely suffers, keeping about 81-93% (C3 93%); (3) against the baseline without Engram (MoE-27B, same parameters and FLOPs), the full Engram-27B is better, e.g. MMLU +3.0, BBH +5.0, HumanEval +3.0. The paper never scores the switched-off model against MoE-27B, so a good answer says the drop is only reported relative to Engram itself."

