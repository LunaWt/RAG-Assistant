[[question]]
id = "q03"
split = "dev"
text = "why does kimi linear still keep some regular attention layers instead of going fully linear, and how many does it keep?"
answer = "Key points: (1) pure linear attention is weak at long-context retrieval, so a few full (global MLA) layers are kept to preserve global information flow; (2) the mix is 3 KDA layers per 1 full MLA layer (3:1), which was the best ratio in their ablation. Tempting confusion: HySparse2 also keeps a few full-attention layers, but for a different design (indexing for sparse layers)."

[[question.evidence]]
doc = "kimi_linear"
quotes = ['''Long-context retrieval remains the primary bottleneck for pure linear attention''', '''preserving global information flow via the full attention layers''']

[[question.evidence]]
doc = "kimi_linear"
quotes = ['''repeating 3 KDA layers to 1 full MLA layer''', '''a hybrid design adopting a 3:1 KDA-to-global attention ratio''', '''interleaves KDA with periodic full attention layers in a uniform 3:1 ratio''']

