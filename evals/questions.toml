split = "test"
text = "is kimi linear actually faster than normal full attention on really long inputs?"
answer = "Key points: (1) decoding: up to about 6x faster per output token at 1M context (figure labels 4.8x, 5.7x, 6.3x); (2) prefill: about 2.3x faster at 512k and 2.9x at 1M. At short lengths (4k-16k) it is about the same as MLA; the gap opens from 128k."

