[[question]]
id = "q11"
split = "test"
text = "how does engram know when to actually use what it looked up and when to ignore it?"
answer = "Key points: (1) a context-aware gate compares the current hidden state (as query) with the retrieved memory (as key); if the memory contradicts the context the gate goes toward zero and suppresses it; (2) in practice the gate fires when a local, fixed pattern is completed, such as multi-token named entities and set phrases. Tempting confusion: Kimi Linear's forget/output gates, which do something different."

[[question.evidence]]
doc = "engram"
quotes = ['''contradicts the current context $\mathbf{h}_t$, the gate $\alpha_t$ tends toward zero''']

[[question.evidence]]
doc = "engram"
quotes = ['''activates (shown in red) upon completing local, static patterns''']

