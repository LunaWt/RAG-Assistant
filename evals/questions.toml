[[question]]
id = "q01"
split = "dev"
text = "how did hysparse 2 do on long-context benchmarks compared to the other architectures?"
answer = "Key points: (1) after pretraining it has the best long-context scores of the three (RULER 90.77, NoLiMa 49.76), +5.88 and +9.49 over HySparse; (2) after light post-training it leads on retrieval, mean MRCR-v2 +11.30 and RULER-v2 +19.81 points over HySparse (e.g. 58.45 vs 32.61/35.74 on RULER-v2 at 256k). Compared against HySparse and Hybrid SWA."

