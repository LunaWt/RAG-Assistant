[[question]]
id = "q07"
split = "test"
text = "if you keep engram's huge lookup table in cpu memory instead of the gpu, how much does that slow inference down?"
answer = "Key points: barely at all. With a 100B-parameter table offloaded to host memory the throughput hit is under 3%, at most 2.8% (8B dense: 6,140.02 vs 6,315.52 tok/s), because the lookups are deterministic and can be prefetched while the earlier layers compute. Don't confuse this with Nexus, which only mentions CPU offloading for its inner model copy."

[[question.evidence]]
doc = "engram"
quotes = ['''throughput penalty, peaking at only 2.8% on the 8B backbone''', '''offloading a 100B-parameter table to host memory incurs negligible overhead ($<3\%$)''', '''| 8B-Dense | Baseline<br>+ 100B Engram (CPU Offload) | 6,315.52<br>6,140.02 |''']

[[question]]
id = "q08"
split = "test"
text = "nexus сильно замедляет обучение или ест больше памяти по сравнению с обычным претрейном?"
answer = "Key points: (1) compute: almost no extra cost, the number of forward/backward passes is the same, the only extra work is copying/updating the inner model; (2) memory: the only overhead is the inner model copy, which can be pushed to nearly zero with CPU offloading and asynchronous processing."

[[question.evidence]]
